name: Offline repository validation
on:
  push:
    branches: [refactor/organize-research-layout]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Structure, syntax, root discovery and frozen SHA-256 hashes
        run: |
          python tests/check_layout.py
          python tests/check_notebooks.py
      - name: Install CPU notebook dependencies (setup requires internet)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze > /tmp/regulatory-validation-dependencies.txt
      - name: Execute offline notebook smoke checks (network blocked by test harness)
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -u tests/offline_smoke.py
      - name: Ensure validation preserved tracked files
        run: git diff --exit-code
      - name: Record resolved dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python311-validation-dependencies
          path: /tmp/regulatory-validation-dependencies.txt
